[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oxybelis"
version = "0.3.1"
description = "Oxybelis – a statically-typed, Python-inspired language that transpiles to C++"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"

[project.scripts]
oxybelis = "oxybelis:main"
ox-lsp = "ox_lsp:main"
ox-fmt = "ox_fmt:cli"

[tool.setuptools]
py-modules = ["oxybelis", "ox_diag", "ox_fmt", "ox_lsp"]
