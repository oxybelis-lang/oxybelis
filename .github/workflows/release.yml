name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4
        with:
          # repository contains a vendored NumCpp tree that is not a git submodule
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Nuitka
        run: pip install nuitka

      - name: Build self-hosting compiler
        shell: bash
        run: |
          # Use Python compiler to build the self-hosting compiler
          python oxybelis.py -S compiler.ox > compiler.cpp
          # Select C++ compiler per platform
          CXX="g++"
          MCONSOLE=""
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            CXX="g++"
            MCONSOLE="-mconsole"
          elif [[ "${{ matrix.os }}" == macos-* ]]; then
            CXX="clang++"
          else
            CXX="g++"
          fi
          # Ensure NumCpp headers from the repository are found during compilation
          $CXX -O3 -std=c++20 -I NumCpp/include $MCONSOLE compiler.cpp -o oxybelis${{ matrix.ext }}
          echo "=== Self-hosting compiler ==="
          ls -la oxybelis${{ matrix.ext }}

      - name: Build Nuitka extras
        shell: bash
        run: |
          if [ -f ox_fmt.py ] && [ -f ox_lsp.py ]; then
            python -m nuitka --onefile --output-filename=ox-fmt${{ matrix.ext }} --assume-yes-for-downloads ox_fmt.py
            python -m nuitka --onefile --output-filename=ox-lsp${{ matrix.ext }} --assume-yes-for-downloads ox_lsp.py
            echo "=== Nuitka extras ==="
            ls -la ox-fmt* ox-lsp* 2>/dev/null || true
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar czf "oxybelis-${{ matrix.target }}.tar.gz" \
            oxybelis ox-fmt ox-lsp

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          7z a "oxybelis-${{ matrix.target }}.zip" \
            oxybelis.exe ox-fmt.exe ox-lsp.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oxybelis-${{ matrix.target }}
          path: oxybelis-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            oxybelis-*/oxybelis-*.tar.gz
            oxybelis-*/oxybelis-*.zip
          generate_release_notes: true
